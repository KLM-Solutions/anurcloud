# Cloud Build — build the vLLM image and push it to Artifact Registry.
# The image is large (~10 GB with weights baked in), so we give the build a
# bigger machine, more disk, and a long timeout.
#
# Run from the deploy/ folder:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=asia-southeast1,_REPO=instaviz-llm,_TAG=qwen3.5-4b-v3 \
#     --project digital-cards-ai

substitutions:
  _REGION: asia-southeast1
  _REPO: instaviz-llm
  _TAG: qwen3.5-4b-v3

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/instaviz-llm:${_TAG}'

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 120

timeout: 3600s

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/instaviz-llm:${_TAG}'
      - '.'
